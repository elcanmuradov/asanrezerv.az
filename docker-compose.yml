name: rezervet

services:
  # ---------------- İnfrastruktur ----------------
  postgres:
    image: postgres:17-alpine
    container_name: rezervet-postgres
    environment:
      POSTGRES_DB: rezervet
      POSTGRES_USER: rezervet
      POSTGRES_PASSWORD: rezervet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezervet -d rezervet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rezervet-net

  redis:
    image: redis:7-alpine
    container_name: rezervet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rezervet-net

  # Kafka (KRaft rejimi — Zookeeper-siz, tək node).
  # Servislər daxildən `kafka:9092`, host-dan (debug) `localhost:29092`.
  kafka:
    image: apache/kafka:3.8.1
    container_name: rezervet-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - rezervet-net

  # Elasticsearch — search-service-in indeksi (restoran/filial axtarışı).
  # Tək node, təhlükəsizlik söndürülüb (yalnız daxili şəbəkə, lokal dev üçün kifayətdir).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: rezervet-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - rezervet-net

  # ---------------- Backend servisləri ----------------
  # DİQQƏT: auth-service və restaurant-service host-a AÇILMIR (ports yoxdur).
  # Onlara yalnız api-gateway daxili şəbəkədən çata bilir — təhlükəsizlik modeli budur.

  auth-service:
    build: 
      context: ./rezervet-backend/auth-service
      dockerfile: Dockerfile
    container_name: rezervet-auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rezervet
      SPRING_DATASOURCE_USERNAME: rezervet
      SPRING_DATASOURCE_PASSWORD: rezervet
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_SECRET_KEY: 
   
    networks:
      - rezervet-net

  restaurant-service:
    build:
      context: ./rezervet-backend/restaurant-service
      dockerfile: Dockerfile
    container_name: rezervet-restaurant
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rezervet
      SPRING_DATASOURCE_USERNAME: rezervet
      SPRING_DATASOURCE_PASSWORD: rezervet
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Redis (limit cache) + Kafka (limit event-ləri)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - rezervet-net
  staff-service:
    build: 
      context: ./rezervet-backend/staff-service
      dockerfile: Dockerfile
    container_name: rezervet-staff
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rezervet
      SPRING_DATASOURCE_USERNAME: rezervet
      SPRING_DATASOURCE_PASSWORD: rezervet
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: unless-stopped
    networks:
      - rezervet-net
  subscription-service:
    build: 
      context: ./rezervet-backend/subscription-service
      dockerfile: Dockerfile
    container_name: rezervet-subscription
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rezervet
      SPRING_DATASOURCE_USERNAME: rezervet
      SPRING_DATASOURCE_PASSWORD: rezervet
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - rezervet-net

  reservation-service:
    build: 
      context: ./rezervet-backend/reservation-service
      dockerfile: Dockerfile
    container_name: rezervet-reservation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rezervet
      SPRING_DATASOURCE_USERNAME: rezervet
      SPRING_DATASOURCE_PASSWORD: rezervet
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - rezervet-net

  # AI analitika — stateless (DB yox), yalnız Redis + Feign (digər servisləri oxuyur)
  ai-analysis-service:
    build:
      context: ./rezervet-backend/ai-analysis-service
      dockerfile: Dockerfile
    container_name: rezervet-ai-analysis
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # LLM narrative (Level 2). Key əlavə olununca AI_LLM_ENABLED=true et.
      AI_LLM_ENABLED: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - rezervet-net

  # Restoran/filial axtarışı — Elasticsearch üzərində, Kafka event-ləri ilə sinxronlaşır.
  search-service:
    build:
      context: ./rezervet-backend/search-service
      dockerfile: Dockerfile
    container_name: rezervet-search
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - rezervet-net

  media-service:
    build:
      context: ./rezervet-backend/media-service
      dockerfile: Dockerfile
    container_name: rezervet-media
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
    networks:
      - rezervet-net

  # ---------------- API Gateway (yeganə açıq backend giriş nöqtəsi) ----------------
  api-gateway:
    build: 
      context: ./rezervet-backend/api-gateway
      dockerfile: Dockerfile
    container_name: rezervet-gateway
    environment:
      SERVER_PORT: 8080
      SPRING_SECURITY_SECRET_KEY: ${JWT_SECRET}
      SERVICES_AUTH_URI: http://auth-service:8080
      SERVICES_RESTAURANT_URI: http://restaurant-service:8080
      # Aşağıdakılar hələ mövcud deyil — çağırılanda 503 qaytaracaq, start-a mane olmur.
      SERVICES_RESERVATION_URI: http://reservation-service:8080
      SERVICES_SUBSCRIPTION_URI: http://subscription-service:8080
      SERVICES_AI_URI: http://ai-analysis-service:8080
      SERVICES_SEARCH_URI: http://search-service:8080
    depends_on:
      - auth-service
      - restaurant-service
      - staff-service
      - subscription-service
      - reservation-service
      - ai-analysis-service
      - search-service
    networks:
      - rezervet-net

  # ---------------- Frontend (nginx: statik + /api proxy) ----------------
  frontend:
    build: ./rezervet-frontend
    container_name: rezervet-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - rezervet-net

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  elasticsearch_data:

networks:
  rezervet-net:
    driver: bridge
