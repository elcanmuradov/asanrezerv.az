server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    # Spring Boot 4.1 + Spring Cloud 2025.1.x uyğunluq yoxlamasını söndür
    # (verifier Boot 4.0.x tələb edir; runtime-da 4.1 işləyir).
    compatibility-verifier:
      enabled: false
  security:
    # auth-service ilə EYNİ açar olmalıdır — imzanı yoxlamaq üçün.
    # Docker-da env (SPRING_SECURITY_SECRET_KEY) ilə override olunur.
    secret-key: ${SPRING_SECURITY_SECRET_KEY:

# Downstream servis ünvanları. Lokalda default localhost, Docker-da env override edir.
services:
  auth-uri: ${SERVICES_AUTH_URI:http://auth-service:8080}
  restaurant-uri: ${SERVICES_RESTAURANT_URI:http://restaurant-service:8080}
  reservation-uri: ${SERVICES_RESERVATION_URI:http://reservation-service:8080}
  subscription-uri: ${SERVICES_SUBSCRIPTION_URI:http://subscription-service:8080}
  staff-uri: ${SERVICES_STAFF_URI:http://staff-service:8080}
  payment-uri: ${SERVICES_PAYMENT_URI:http://payment-service:8080}
  ai-uri: ${SERVICES_AI_URI:http://ai-analysis-service:8080}
  search-uri: ${SERVICES_SEARCH_URI:http://search-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
