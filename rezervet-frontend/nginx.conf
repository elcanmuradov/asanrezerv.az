# Frontend nginx: statik faylları verir + /api sorğularını Gateway-ə proxy edir.
# Beləliklə brauzer üçün hər şey eyni origin-dədir — CORS lazım deyil.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API sorğuları -> api-gateway (Docker daxili şəbəkə)
    # DİQQƏT: Host header-i $http_host olmalıdır ($host YOX) — $host portu atır,
    # bu da Spring OAuth2-nin {baseUrl}-i (redirect_uri) səhv qurmasına səbəb olur
    # (backend öz daxili portunu, məs. 8080-i, istifadə edir).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google OAuth2 axını (Spring Security default endpoint-ləri, /api xaricində) -> api-gateway -> auth-service
    location /oauth2/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /login/oauth2/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — React Router marşrutları üçün həmişə index.html qaytar
    location / {
        try_files $uri $uri/ /index.html;
    }
}
